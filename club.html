<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
 <h1>Hiking Club Sign up!</h1> 
 <form>




<label for="studentname">Your Name:</label>
<input type="text" id="studentname" name = "studentname" placeholder = "First and Last Name">

<br>


<label for="studentemail">School Email:</label>
<input type="email" id="studentemail" name = "studentemail" placeholder = "School Email">


<br>

<label for = "mostexcitedfor">What you are most excited for:</label>
<textarea name = "mostexcitedfor" id="mostexcitedfor" cols="40" rows="3" placeholder = "Tell us what you're most excited about!"></textarea>
 <p>
   <input type="checkbox" id="agree" required>
   <label for="agree">I agree to be kind to all members</label>
 </p>

<br>
 <button type="submit">Join Hiking Club!</button>
 </form>


</body>
</html>
